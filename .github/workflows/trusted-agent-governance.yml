name: Trusted Agent Governance

on:
  pull_request_target:
    branches: [integration/ios-current]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  trusted-agent-governance:
    name: trusted-agent-governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable PR base
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout candidate as untrusted data only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Run only the base-owned verifier
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: >-
          node trusted-base/tools/trusted-governance/validate.mjs
          --trusted-root trusted-base
          --candidate-root candidate
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --branch "$HEAD_BRANCH"
