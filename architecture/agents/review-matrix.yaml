{
  "Version": "2.2.0-source-authored-runtime-verified",
  "PlatformState": "SOURCE_AUTHORED_RUNTIME_VERIFIED_ACTIVATION_CLOSED",
  "TaskTypes": [
    "orchestrator self-change",
    "upstream/profile/model",
    "governance",
    "repository-wide architecture audit",
    "documentation only",
    "tests",
    "production/runtime domain",
    "mixed/unknown"
  ],
  "AlwaysRequiredAgents": [],
  "BaselineControls": [
    "security",
    "privacy",
    "secret-scan",
    "architecture-impact",
    "runtime-discovery-unverified"
  ],
  "Rules": [
    {
      "RuleId": "ORCHESTRATOR_SELF_CHANGE",
      "TaskType": "orchestrator self-change",
      "PathPatterns": [
        ".codex/agents/ios-agent-orchestrator.toml",
        "architecture/agents/registry/agent-integrity-registry.yaml",
        "tools/agents/orchestrate.mjs"
      ],
      "RequiredAgents": [
        "agent-governance-auditor",
        "security-privacy-auditor"
      ],
      "RequiredControls": [
        "owner-approval",
        "anti-self-review",
        "governance-tamper-check"
      ]
    },
    {
      "RuleId": "UPSTREAM_PROFILE_MODEL",
      "TaskType": "upstream/profile/model",
      "PathPatterns": [
        "architecture/agents/upstream/**",
        "architecture/agents/contracts/capabilities/**",
        "architecture/agents/registry/**",
        ".codex/agents/**"
      ],
      "RequiredAgents": [
        "ios-agent-orchestrator",
        "agent-governance-auditor",
        "security-privacy-auditor"
      ],
      "RequiredControls": [
        "upstream-integrity",
        "canonical-profile-integrity",
        "deny-by-default-capability",
        "no-silent-downgrade",
        "runtime-evidence"
      ]
    },
    {
      "RuleId": "GOVERNANCE_SELF_CHANGE",
      "TaskType": "governance",
      "PathPatterns": [
        "AGENTS.md",
        "**/AGENTS.md",
        "architecture/agents/**",
        "audit/agents/**",
        "docs/agents/**",
        "package.json",
        "tools/*agent*",
        "tools/agents/**",
        "tools/publication-privacy-check.mjs",
        "tools/trusted-governance/**",
        ".github/workflows/*agent*",
        "rfc/**",
        "adr/**"
      ],
      "RequiredAgents": [
        "ios-agent-orchestrator",
        "agent-governance-auditor",
        "security-privacy-auditor",
        "audit-traceability-reviewer"
      ],
      "RequiredControls": [
        "owner-approval",
        "privacy",
        "secret-scan",
        "governance-tamper-check",
        "runtime-discovery-unverified"
      ]
    },
    {
      "RuleId": "REPOSITORY_ARCHITECTURE_AUDIT",
      "TaskType": "repository-wide architecture audit",
      "PathPatterns": [
        "architecture/**",
        "specification/**",
        "IOS_SOURCE_SNAPSHOT/**",
        "IOS_HANDOFF_v4/**"
      ],
      "RequiredAgents": [
        "ios-agent-orchestrator",
        "ios-codebase-auditor",
        "audit-traceability-reviewer"
      ],
      "RequiredControls": [
        "architecture-impact",
        "traceability",
        "runtime-discovery-unverified"
      ]
    },
    {
      "RuleId": "DOCUMENTATION",
      "TaskType": "documentation only",
      "PathPatterns": [
        "docs/**"
      ],
      "RequiredAgents": [
        "ios-agent-orchestrator",
        "audit-traceability-reviewer"
      ],
      "RequiredControls": [
        "traceability",
        "runtime-discovery-unverified"
      ]
    },
    {
      "RuleId": "TESTS",
      "TaskType": "tests",
      "PathPatterns": [
        "tests/**",
        "**/*.test.mjs"
      ],
      "RequiredAgents": [
        "ios-agent-orchestrator",
        "agent-governance-auditor"
      ],
      "RequiredControls": [
        "determinism",
        "no-production-access",
        "runtime-discovery-unverified"
      ]
    },
    {
      "RuleId": "PRODUCTION_RUNTIME_UNAVAILABLE",
      "TaskType": "production/runtime domain",
      "PathPatterns": [
        "apps-script/**",
        "IOS_SOURCE_SNAPSHOT/work/apps-script/**",
        "**/*Schema*.gs",
        "**/*Provider*.mjs",
        "**/MarketRegime.gs",
        "**/DecisionEngine.gs",
        "**/R030*",
        "**/TradePlan*"
      ],
      "RequiredAgents": [
        "ios-agent-orchestrator",
        "agent-governance-auditor",
        "security-privacy-auditor",
        "audit-traceability-reviewer"
      ],
      "RequiredControls": [
        "mandatory-domain-reviewer-not-integrated",
        "no-production-write",
        "runtime-discovery-unverified"
      ]
    }
  ],
  "FailClosed": {
    "UnknownTaskType": "mixed/unknown",
    "EmptyDiff": "BLOCK",
    "RequiredAgents": [
      "ios-agent-orchestrator",
      "agent-governance-auditor",
      "security-privacy-auditor",
      "audit-traceability-reviewer"
    ],
    "MandatoryAvailability": "RUNTIME_AVAILABLE_ACTIVATION_CLOSED",
    "OverallResult": "BLOCKED"
  },
  "Transition": {
    "ActiveCustomAgents": 0,
    "ProvisionalAgents": 0,
    "OldRegistryReferences": 0,
    "OldMatrixReferences": 0,
    "OldResolverReferences": 0,
    "OldManifestsAccepted": false,
    "ResolverBehavior": "FAIL_CLOSED",
    "ActivationGate": "OWNER_ACTIVATION_REQUIRED"
  },
  "AntiTamperPaths": [
    "AGENTS.md",
    "**/AGENTS.md",
    ".codex/agents/**",
    ".codex/agents/**",
    "architecture/agents/**",
    "docs/agents/**",
    "tools/agents/**",
    "tools/trusted-governance/**",
    ".github/workflows/*agent*"
  ],
  "ExceptionPolicy": {
    "VersionedFileRequired": true,
    "RequiredFields": [
      "ExceptionId",
      "RfcAdrReference",
      "OwnerApproval",
      "Reason",
      "Expiry",
      "RiskAcceptance",
      "ExcludedAgents"
    ],
    "CannotExcludeAgents": [
      "agent-governance-auditor",
      "security-privacy-auditor"
    ],
    "CannotDisableControls": [
      "security",
      "privacy",
      "secret-scan",
      "architecture-impact",
      "development-activation-owner-authorized"
    ],
    "ExpiredOrUnauthorized": "BLOCK"
  }
}
