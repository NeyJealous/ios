{
  "Version": "2.1.0-provisional",
  "PlatformState": "PROVISIONAL_PLATFORM_BUILD",
  "TaskTypes": [
    "orchestrator self-change",
    "upstream/profile/model",
    "governance",
    "repository-wide architecture audit",
    "documentation only",
    "tests",
    "production/runtime domain",
    "mixed/unknown"
  ],
  "AlwaysRequiredAgents": [],
  "BaselineControls": [
    "security",
    "privacy",
    "secret-scan",
    "architecture-impact",
    "activation-closed"
  ],
  "Rules": [
    {
      "RuleId": "ORCHESTRATOR_SELF_CHANGE",
      "TaskType": "orchestrator self-change",
      "PathPatterns": [
        ".codex/agents/ios-agent-orchestrator.toml",
        "architecture/agents/generated/provisional/ios-agent-orchestrator.toml",
        "architecture/agents/overlays/ios-agent-orchestrator.yaml",
        "architecture/agents/compositions/ios-agent-orchestrator.yaml",
        "tools/agents/orchestrate.mjs"
      ],
      "RequiredAgents": [
        "agent-governance-auditor",
        "security-privacy-auditor"
      ],
      "RequiredControls": [
        "owner-approval",
        "anti-self-review",
        "governance-tamper-check"
      ]
    },
    {
      "RuleId": "UPSTREAM_PROFILE_MODEL",
      "TaskType": "upstream/profile/model",
      "PathPatterns": [
        "architecture/agents/upstream/**",
        "architecture/agents/generated/provisional/**",
        "architecture/agents/overlays/**",
        "architecture/agents/compositions/**",
        "architecture/agents/registry/**",
        ".codex/agents/**"
      ],
      "RequiredAgents": [
        "ios-agent-orchestrator",
        "agent-governance-auditor",
        "security-privacy-auditor"
      ],
      "RequiredControls": [
        "upstream-integrity",
        "append-only-overlay",
        "no-silent-downgrade",
        "runtime-discovery-empty"
      ]
    },
    {
      "RuleId": "GOVERNANCE_SELF_CHANGE",
      "TaskType": "governance",
      "PathPatterns": [
        "AGENTS.md",
        "**/AGENTS.md",
        "architecture/agents/**",
        "docs/agents/**",
        "tools/*agent*",
        "tools/agents/**",
        "tools/trusted-governance/**",
        ".github/workflows/*agent*",
        "rfc/**",
        "adr/**"
      ],
      "RequiredAgents": [
        "ios-agent-orchestrator",
        "agent-governance-auditor",
        "security-privacy-auditor",
        "audit-traceability-reviewer"
      ],
      "RequiredControls": [
        "owner-approval",
        "privacy",
        "secret-scan",
        "governance-tamper-check",
        "activation-closed"
      ]
    },
    {
      "RuleId": "REPOSITORY_ARCHITECTURE_AUDIT",
      "TaskType": "repository-wide architecture audit",
      "PathPatterns": [
        "architecture/**",
        "specification/**",
        "IOS_SOURCE_SNAPSHOT/**",
        "IOS_HANDOFF_v4/**"
      ],
      "RequiredAgents": [
        "ios-agent-orchestrator",
        "ios-codebase-auditor",
        "audit-traceability-reviewer"
      ],
      "RequiredControls": [
        "architecture-impact",
        "traceability",
        "activation-closed"
      ]
    },
    {
      "RuleId": "DOCUMENTATION",
      "TaskType": "documentation only",
      "PathPatterns": [
        "docs/**"
      ],
      "RequiredAgents": [
        "ios-agent-orchestrator",
        "audit-traceability-reviewer"
      ],
      "RequiredControls": [
        "traceability",
        "activation-closed"
      ]
    },
    {
      "RuleId": "TESTS",
      "TaskType": "tests",
      "PathPatterns": [
        "tests/**",
        "**/*.test.mjs"
      ],
      "RequiredAgents": [
        "ios-agent-orchestrator",
        "agent-governance-auditor"
      ],
      "RequiredControls": [
        "determinism",
        "no-production-access",
        "activation-closed"
      ]
    },
    {
      "RuleId": "PRODUCTION_RUNTIME_UNAVAILABLE",
      "TaskType": "production/runtime domain",
      "PathPatterns": [
        "apps-script/**",
        "IOS_SOURCE_SNAPSHOT/work/apps-script/**",
        "**/*Schema*.gs",
        "**/*Provider*.mjs",
        "**/MarketRegime.gs",
        "**/DecisionEngine.gs",
        "**/R030*",
        "**/TradePlan*"
      ],
      "RequiredAgents": [
        "ios-agent-orchestrator",
        "agent-governance-auditor",
        "security-privacy-auditor",
        "audit-traceability-reviewer"
      ],
      "RequiredControls": [
        "mandatory-domain-reviewer-not-integrated",
        "no-production-write",
        "activation-closed"
      ]
    }
  ],
  "FailClosed": {
    "UnknownTaskType": "mixed/unknown",
    "EmptyDiff": "BLOCK",
    "RequiredAgents": [
      "ios-agent-orchestrator",
      "agent-governance-auditor",
      "security-privacy-auditor",
      "audit-traceability-reviewer"
    ],
    "MandatoryAvailability": "PROVISIONAL_AVAILABLE_ACTIVATION_CLOSED",
    "OverallResult": "BLOCKED"
  },
  "Transition": {
    "ActiveCustomAgents": 0,
    "ProvisionalAgents": 5,
    "OldRegistryReferences": 0,
    "OldMatrixReferences": 0,
    "OldResolverReferences": 0,
    "OldManifestsAccepted": false,
    "ResolverBehavior": "FAIL_CLOSED",
    "ActivationGate": "CLOSED"
  },
  "AntiTamperPaths": [
    "AGENTS.md",
    "**/AGENTS.md",
    ".codex/agents/**",
    "architecture/agents/generated/provisional/**",
    "architecture/agents/**",
    "docs/agents/**",
    "tools/agents/**",
    "tools/trusted-governance/**",
    ".github/workflows/*agent*"
  ],
  "ExceptionPolicy": {
    "VersionedFileRequired": true,
    "RequiredFields": [
      "ExceptionId",
      "RfcAdrReference",
      "OwnerApproval",
      "Reason",
      "Expiry",
      "RiskAcceptance",
      "ExcludedAgents"
    ],
    "CannotExcludeAgents": [
      "agent-governance-auditor",
      "security-privacy-auditor"
    ],
    "CannotDisableControls": [
      "security",
      "privacy",
      "secret-scan",
      "architecture-impact",
      "activation-closed"
    ],
    "ExpiredOrUnauthorized": "BLOCK"
  }
}
